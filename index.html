<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/icons/exceldex-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Find Excel functions, shortcuts and solutions instantly." />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://asorajx.github.io/exceldex/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ExcelDex" />
    <meta property="og:title" content="ExcelDex" />
    <meta property="og:description" content="Find Excel functions, shortcuts and solutions instantly." />

    <meta name="twitter:title" content="ExcelDex" />
    <meta name="twitter:description" content="Find Excel functions, shortcuts and solutions instantly." />
    <title>ExcelDex</title>
    <script>
      // Apply a saved theme before first paint, so a saved dark theme never flashes light.
      try {
        var t = localStorage.getItem('exceldex-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
